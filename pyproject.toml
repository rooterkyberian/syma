[project]
name = "syma"
version = "0.1.0"
description = "syma X22W protocol hacking"
authors = [
    { name = "Maciej Urbanski", email = "rooter@kyberian.net" }
]
dependencies = [
    "asyncio-dgram>=2.2.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    "ipython>=8.26.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
# for the scripts in tools/
tools = [
    "fire>=0.6.0",
    "scapy>=2.5.0",
    "pyx>=0.16",
    "matplotlib>=3.9.2",
]

[tool.uv]
default-groups = ["dev", "tools"]

[tool.uv.workspace]
members = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


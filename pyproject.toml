[project]
name = "syma"
version = "0.1.0"
description = "syma X22W protocol hacking"
authors = [
    { name = "Maciej Urbanski", email = "rooter@kyberian.net" }
]
dependencies = [
    "fire>=0.6.0",
    "asyncio-dgram>=2.2.0",
    "scapy>=2.5.0",
    "pyx>=0.16",
    "matplotlib>=3.9.2",
    "kivy>=2.3.0",
]
readme = "README.md"
requires-python = ">= 3.12"

[dependency-groups]
dev = [
    "ipython>=8.26.0",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
syma-fly = "drone_ui.ui:main_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syma", "src/drone_ui"]

